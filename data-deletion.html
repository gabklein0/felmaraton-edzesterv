<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Running App Budapest – deletion</title><style>body{margin:0;background:#101722;color:#eaf0f8;font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:780px;margin:40px auto;padding:24px}h1{color:#8bd9ba}h2{margin-top:30px;font-size:1.2rem}a{color:#9dd2ff}button{padding:8px 12px;margin:3px;background:#203e55;color:#fff;border:1px solid #53728b;border-radius:8px;cursor:pointer}.card{background:#182737;border:1px solid #39546b;border-radius:14px;padding:24px}</style></head><body><main><p><a href="./" id="back">← Running App Budapest</a></p><nav aria-label="Language"><button type="button" onclick="setLang('hu')">HU</button><button type="button" onclick="setLang('en')">EN</button><button type="button" onclick="setLang('fr')">FR</button><button type="button" onclick="setLang('de')">DE</button></nav><article class="card"><h1 id="heading"></h1><p><strong id="controllerLabel"></strong>: Kiss Gábor<br><strong id="contactLabel"></strong>: <a href="mailto:kissgabor.hun@gmail.com">kissgabor.hun@gmail.com</a></p><section><h2 id="how"></h2><p id="howText"></p></section><section><h2 id="local"></h2><p id="localText"></p></section><p><a href="privacy.html">Privacy policy / Adatkezelési tájékoztató</a></p></article></main><script>const dict={"hu":{"privacy":"Adatkezelési tájékoztató","deletion":"Felhasználói adatok törlése","controller":"Adatkezelő","contact":"Kapcsolat","data":"Milyen adatokat kezelünk?","dataText":"A regisztráció és bejelentkezés során az e-mail-címet, a hitelesítési azonosítót és – ha elérhető – a megjelenített nevet kezeljük. A választott belépési szolgáltató (Google vagy Facebook) a bejelentkezéshez szükséges adatokat továbbíthatja. Az alkalmazás az önként megadott edzésterv-, futásnapló-, idő-, távolság- és pulzusadatokat is tárolhatja.","purpose":"Cél és jogalap","purposeText":"Az adatokat a fiók működtetéséhez, a bejelentkezéshez, az edzéstervek és naplók mentéséhez, visszaállításához kezeljük. A fiók és az önként igénybe vett funkciók működtetésének jogalapja főszabály szerint a felhasználóval kötött szolgáltatási megállapodás teljesítése (GDPR 6. cikk (1) b)). A pulzusadat egészségügyi adatnak minősülhet; kezeléséhez külön, kifejezett hozzájárulás szükséges lehet. A funkció nyilvános bevezetése előtt ennek technikai kezelését felülvizsgáljuk.","storage":"Tárolás és szolgáltatók","storageText":"A böngésző helyi tárhelyét (localStorage) használjuk helyi adatok és beállítások tárolására. A felhőbe mentett fiók- és edzésadatok kezeléséhez Supabase-t használunk. A Google és a Meta saját adatkezelési szabályzata szerint kezeli a közösségi belépéshez kapcsolódó adatokat. A szolgáltatók infrastruktúrája nemzetközi adattovábbítást is érinthet.","retention":"Megőrzés és jogok","retentionText":"Az adatokat a fiók működése és a mentett edzéstervek használata során őrizzük meg, illetve a törlési kérelem teljesítéséig, kivéve a jogszabály alapján szükséges megőrzést. Kérhető hozzáférés, helyesbítés, törlés, korlátozás és – ahol alkalmazható – adathordozhatóság; panasz a felügyeleti hatóságnál is tehető.","how":"Hogyan kérhetsz törlést?","howText":"Írj az alábbi e-mail-címre a fiókodhoz tartozó e-mail-címről, a tárgyban: „Running App – adattörlés”. Jelezd, hogy a teljes fiókodat és a kapcsolódó felhőben tárolt edzésterveket, futásnaplókat szeretnéd töröltetni. A kérelem feldolgozásához szükség esetén azonosítást kérünk. Visszaigazoljuk a teljesítést, vagy tájékoztatunk az esetleges jogszerű megőrzési kötelezettségről.","local":"Helyi adatok","localText":"A böngésződben tárolt helyi adatokat a böngésző webhelyadatainak törlésével is eltávolíthatod. Ez önmagában nem törli a Supabase-ben tárolt fiók- és felhőadatokat. A Facebook-alkalmazás eltávolítása a Facebook-beállításokban szintén nem helyettesíti a felhőadatok törlésére irányuló kérelmet.","back":"Vissza az alkalmazáshoz"},"en":{"privacy":"Privacy Policy","deletion":"User Data Deletion","controller":"Data controller","contact":"Contact","data":"Data we process","dataText":"We may process your email address, authentication identifier and available display name for registration and sign-in. Google or Facebook may provide information required for authentication. We may also store training plans and voluntarily entered workout records, including dates, distances, times and heart rate.","purpose":"Purpose and legal basis","purposeText":"We process data to provide account access and to save and restore training plans and logs. The primary legal basis for account and requested features is performance of a service agreement (GDPR Article 6(1)(b)). Heart-rate information may constitute health data requiring separate explicit consent. The technical handling of this will be reviewed before public release.","storage":"Storage and providers","storageText":"Browser localStorage stores local information and settings. Supabase is used for cloud accounts and saved workout information. Google and Meta separately process social sign-in data under their own policies. Providers' infrastructure may involve international transfers.","retention":"Retention and rights","retentionText":"We retain information while your account and saved plans are in use or until a deletion request is fulfilled, subject to legal retention requirements. You may request access, correction, erasure, restriction and, where applicable, portability; you may also complain to a supervisory authority.","how":"How to request deletion","howText":"Email the address below from your account email address with the subject “Running App – data deletion”. Request deletion of your account and associated cloud training plans and workout logs. We may ask you to verify your identity. We will confirm completion or explain any lawful retention requirement.","local":"Local information","localText":"You can delete locally stored information by clearing this website's browser data. This does not delete your Supabase account or cloud data. Removing the app in Facebook settings likewise does not replace a request to erase cloud data.","back":"Back to the app"},"fr":{"privacy":"Politique de confidentialité","deletion":"Suppression des données utilisateur","controller":"Responsable du traitement","contact":"Contact","data":"Données traitées","dataText":"Nous pouvons traiter votre adresse e-mail, votre identifiant d'authentification et votre nom affiché. Google ou Facebook peuvent transmettre les données nécessaires à la connexion. Les plans d'entraînement et journaux saisis volontairement, y compris dates, distances, durées et fréquence cardiaque, peuvent être enregistrés.","purpose":"Finalités et base juridique","purposeText":"Les données servent à accéder au compte et à enregistrer et retrouver les entraînements. La base principale est l'exécution du service demandé (RGPD, article 6(1)(b)). La fréquence cardiaque peut constituer une donnée de santé nécessitant un consentement explicite distinct; ce traitement sera réexaminé avant le lancement public.","storage":"Stockage et prestataires","storageText":"Le stockage local du navigateur conserve les réglages et données locales. Supabase héberge les comptes et données enregistrées dans le cloud. Google et Meta traitent séparément les données de connexion selon leurs politiques. Des transferts internationaux peuvent intervenir.","retention":"Conservation et droits","retentionText":"Les données sont conservées pendant l'utilisation du compte et des plans enregistrés, ou jusqu'au traitement d'une demande de suppression, sous réserve d'obligations légales. Vous pouvez demander l'accès, la rectification, l'effacement, la limitation et, le cas échéant, la portabilité, et saisir une autorité de contrôle.","how":"Demander la suppression","howText":"Écrivez à l'adresse ci-dessous depuis l'e-mail associé au compte, avec l'objet « Running App – suppression des données ». Demandez la suppression du compte et des plans et journaux stockés dans le cloud. Une vérification d'identité peut être nécessaire. Nous confirmerons la suppression ou expliquerons toute obligation légale de conservation.","local":"Données locales","localText":"Vous pouvez effacer les données locales via les données de site de votre navigateur. Cela ne supprime pas le compte Supabase ni les données cloud. Retirer l'application dans Facebook ne remplace pas une demande de suppression des données cloud.","back":"Retour à l'application"},"de":{"privacy":"Datenschutzerklärung","deletion":"Löschung von Nutzerdaten","controller":"Verantwortlicher","contact":"Kontakt","data":"Verarbeitete Daten","dataText":"Wir verarbeiten gegebenenfalls E-Mail-Adresse, Authentifizierungskennung und Anzeigenamen. Google oder Facebook können für die Anmeldung erforderliche Daten übermitteln. Freiwillig eingegebene Trainingspläne und Trainingstagebücher mit Datum, Distanz, Zeit und Puls können gespeichert werden.","purpose":"Zwecke und Rechtsgrundlage","purposeText":"Die Daten dienen der Anmeldung und dem Speichern und Wiederherstellen von Trainingsplänen und Protokollen. Rechtsgrundlage ist grundsätzlich die Erfüllung der angeforderten Dienstleistung (Art. 6 Abs. 1 lit. b DSGVO). Pulswerte können Gesundheitsdaten darstellen und eine gesonderte ausdrückliche Einwilligung erfordern. Dies wird vor einer öffentlichen Einführung technisch geprüft.","storage":"Speicherung und Anbieter","storageText":"Lokale Daten und Einstellungen werden im Browser-localStorage gespeichert. Supabase wird für Cloud-Konten und gespeicherte Trainingsdaten verwendet. Google und Meta verarbeiten Anmeldedaten nach eigenen Datenschutzrichtlinien. Internationale Datenübermittlungen sind möglich.","retention":"Speicherdauer und Rechte","retentionText":"Daten bleiben während der Nutzung des Kontos und gespeicherter Pläne beziehungsweise bis zur Erfüllung eines Löschantrags gespeichert, soweit keine gesetzlichen Pflichten entgegenstehen. Betroffene können Auskunft, Berichtigung, Löschung, Einschränkung und gegebenenfalls Übertragbarkeit verlangen und sich bei einer Aufsichtsbehörde beschweren.","how":"Löschung beantragen","howText":"Schreiben Sie von der mit dem Konto verbundenen E-Mail-Adresse an die unten genannte Adresse mit dem Betreff „Running App – Datenlöschung“. Beantragen Sie die Löschung des Kontos und der zugehörigen Cloud-Trainingspläne und -protokolle. Eine Identitätsprüfung kann erforderlich sein. Wir bestätigen die Löschung oder erläutern gesetzliche Aufbewahrungspflichten.","local":"Lokale Daten","localText":"Lokale Informationen können über das Löschen der Websitedaten im Browser entfernt werden. Dadurch werden Supabase-Konto und Cloud-Daten nicht gelöscht. Das Entfernen der App bei Facebook ersetzt keinen Antrag auf Löschung der Cloud-Daten.","back":"Zurück zur App"}};function setLang(l){const t=dict[l]||dict.hu;document.documentElement.lang=l;document.getElementById('heading').textContent=t.deletion;document.getElementById('controllerLabel').textContent=t.controller;document.getElementById('contactLabel').textContent=t.contact;document.getElementById('back').textContent='← '+t.back;document.getElementById('how').textContent=t.how;document.getElementById('howText').textContent=t.howText;document.getElementById('local').textContent=t.local;document.getElementById('localText').textContent=t.localText;}setLang((navigator.language||'hu').slice(0,2) in dict?(navigator.language||'hu').slice(0,2):'hu');</script></body></html>
